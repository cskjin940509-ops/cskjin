name: Backfill AStock ETF 485-Day History

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tools/backfill_etf_485.py'
      - 'tools/test_backfill_etf_485.py'
      - '.github/workflows/backfill-etf-history.yml'
  schedule:
    # Keep the long historical catch-up outside the morning prediction workflow.
    # Beijing time 17:05 on weekdays.
    - cron: '5 9 * * 1-5'

permissions:
  contents: write
  actions: write

concurrency:
  group: astock-etf-history-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate ETF backfill
        run: python -m unittest tools/test_backfill_etf_485.py
      - name: Install Tushare adapter
        run: python -m pip install --quiet 'tushare>=1.4,<2'
      - name: Resume 485-day ETF share history
        env:
          STOCK_API_TOKEN: ${{ secrets.STOCK_API_TOKEN }}
          STOCK_API_URL: https://jiaoch.top/
          ETF_BACKFILL_WORKERS: 6
        run: python tools/backfill_etf_485.py
      - name: Publish verified historical inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_data_on_arrival.py factors
