name: Build AStock v2.8 全中文AI影子实盘 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-astock-v1-fixed.yml'
      - 'astock_gateway/trigger-v1-fixed.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 记录构建编号
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONTENT=$(printf '%s' '${{ github.run_id }}' | base64 -w0)
          OLD_SHA=$(gh api repos/${{ github.repository }}/contents/latest-v1-fixed-run.txt?ref=main --jq .sha 2>/dev/null || true)
          if [ -n "$OLD_SHA" ]; then
            gh api --method PUT repos/${{ github.repository }}/contents/latest-v1-fixed-run.txt -f message='Record latest fixed v1 build run' -f content="$CONTENT" -f sha="$OLD_SHA" -f branch='main' >/dev/null
          else
            gh api --method PUT repos/${{ github.repository }}/contents/latest-v1-fixed-run.txt -f message='Record latest fixed v1 build run' -f content="$CONTENT" -f branch='main' >/dev/null
          fi
      - uses: actions/checkout@v4
        with:
          ref: astock-build-v0.6-live
      - name: 应用多源行情与中文界面补丁
        run: python tools/patch_v1_android.py
      - name: 接入板块与个股二级详情页
        run: python tools/patch_detail_navigation.py
      - name: 修复详情页编译兼容
        run: python tools/patch_detail_compile_fixes.py
      - name: 接入两两组合筛选池
        run: python tools/patch_pairwise_pools.py
      - name: 接入云AI量化数据源状态
        run: python tools/patch_yunai_ui.py
      - name: 展示数据审计可信状态
        run: python tools/patch_data_audit_ui.py
      - name: 增加板块三级数据源与新鲜度标记
        run: python tools/patch_board_source_failover.py
      - name: 修复北交所代码映射
        run: python tools/patch_bse_market_mapping.py
      - name: 接入尾盘滚动池
        run: python tools/patch_tail_decision_ui.py
      - name: 完整解析正式数据并打通板块个股下钻
        run: python tools/patch_v1_9_data_display.py
      - name: 区分完整核对与部分核对跟踪
        run: python tools/patch_audit_tracking_labels.py
      - name: 补齐尾盘板块下钻与板块收益跟踪
        run: python tools/patch_v2_drilldown_completion.py
      - name: 接入交易辅助并完成全中文金融术语
        run: python tools/patch_chinese_trade_assistant.py
      - name: 清理剩余英文展示词
        run: python tools/patch_chinese_ui_cleanup.py
      - name: 接入实盘执行辅助面板
        run: python tools/patch_execution_panel_v2.py
      - name: 统一股票池布局并接入历史同形态候选
        run: python tools/patch_v2_3_setup_and_pool_layout.py
      - name: 最终编译兼容检查
        run: python tools/patch_v2_3_compile_compat.py
      - name: 持久化买卖与收益日志
        run: |
          python tools/patch_v2_4_trade_journal.py || true
          python tools/patch_v2_4_trade_journal_finish.py
      - name: 接入全天提前主线雷达与逐日收益/组合净值
        run: python tools/patch_v2_5_early_radar_tracking.py
      - name: 接入个股交易与持仓收益界面
        run: |
          python tools/patch_v2_6_stock_trading_cn.py || python tools/patch_v2_6_stock_ui_hotfix.py
      - name: 强制执行最终全中文显示层
        run: |
          python tools/patch_v2_7_full_chinese_ui.py || python tools/patch_v2_7_full_chinese_ui_finish.py
      - name: 接入AI影子实盘组合
        run: python tools/patch_v2_8_ai_shadow_portfolio.py
      - name: 输出编译错误附近源码
        run: |
          echo '--- V6Activity 870-895 ---'
          nl -ba app/src/main/java/com/rui/astockstrategy/v6/V6Activity.kt | sed -n '870,895p'
          echo '--- PreviewSector definition ---'
          grep -n -A10 -B2 'data class PreviewSector' app/src/main/java/com/rui/astockstrategy/v6/V6Activity.kt || true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: 安装Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: 恢复固定应用签名
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: astock-debug-signing-v1
      - name: 编译APK
        run: gradle :app:assembleDebug --stacktrace
      - name: 上传APK
        uses: actions/upload-artifact@v4
        with:
          name: AStockStrategy-v2.8-full-chinese-ai-shadow-portfolio-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
