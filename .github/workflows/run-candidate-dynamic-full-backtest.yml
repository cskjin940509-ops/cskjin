name: Run Candidate Dynamic Full Backtest
on:
  push:
    paths:
      - '.github/workflows/run-candidate-dynamic-full-backtest.yml'
      - 'tools/backtest_candidate_dynamic_full.py'
      - 'tools/backtest_candidate_8day.py'
      - 'tools/backtest_candidate_8day_fast.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: candidate-dynamic-full-backtest
  cancel-in-progress: true
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install market data dependency
        run: python -m pip install --quiet pytdx==1.72
      - name: Run dynamic full-investment backtest
        run: python tools/backtest_candidate_dynamic_full.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/candidate_dynamic_full_backtest_20261007.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Publish dynamic full-investment backtest result"
            git pull --rebase origin main
            git push
          fi
# trigger: 2026-10-07 dynamic full-investment run
