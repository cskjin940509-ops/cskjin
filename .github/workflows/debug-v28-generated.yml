name: Debug v2.8 Generated Kotlin
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/debug-v28-generated.yml'
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astock-build-v0.6-live
      - name: 生成v2.8源码
        run: |
          python tools/patch_v1_android.py
          python tools/patch_detail_navigation.py
          python tools/patch_detail_compile_fixes.py
          python tools/patch_pairwise_pools.py
          python tools/patch_yunai_ui.py
          python tools/patch_data_audit_ui.py
          python tools/patch_board_source_failover.py
          python tools/patch_bse_market_mapping.py
          python tools/patch_tail_decision_ui.py
          python tools/patch_v1_9_data_display.py
          python tools/patch_audit_tracking_labels.py
          python tools/patch_v2_drilldown_completion.py
          python tools/patch_chinese_trade_assistant.py
          python tools/patch_chinese_ui_cleanup.py
          python tools/patch_execution_panel_v2.py
          python tools/patch_v2_3_setup_and_pool_layout.py
          python tools/patch_v2_3_compile_compat.py
          python tools/patch_v2_4_trade_journal.py || true
          python tools/patch_v2_4_trade_journal_finish.py
          python tools/patch_v2_5_early_radar_tracking.py
          python tools/patch_v2_6_stock_trading_cn.py || python tools/patch_v2_6_stock_ui_hotfix.py
          python tools/patch_v2_7_full_chinese_ui.py || python tools/patch_v2_7_full_chinese_ui_finish.py
          python tools/patch_v2_8_ai_shadow_portfolio.py
      - name: 保存问题区段
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'V6Activity lines 860-905:'
            nl -ba app/src/main/java/com/rui/astockstrategy/v6/V6Activity.kt | sed -n '860,905p'
            echo
            echo 'PreviewSector:'
            grep -n -A12 -B2 'data class PreviewSector' app/src/main/java/com/rui/astockstrategy/v6/V6Activity.kt || true
          } > /tmp/generated-v28-debug.txt
          CONTENT=$(base64 -w0 /tmp/generated-v28-debug.txt)
          OLD_SHA=$(gh api repos/${{ github.repository }}/contents/generated-v28-debug.txt?ref=main --jq .sha 2>/dev/null || true)
          if [ -n "$OLD_SHA" ]; then
            gh api --method PUT repos/${{ github.repository }}/contents/generated-v28-debug.txt -f message='Update generated v2.8 debug snippet' -f content="$CONTENT" -f sha="$OLD_SHA" -f branch=main >/dev/null
          else
            gh api --method PUT repos/${{ github.repository }}/contents/generated-v28-debug.txt -f message='Add generated v2.8 debug snippet' -f content="$CONTENT" -f branch=main >/dev/null
          fi
