name: Run AStock 14:30 Tail Decision

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tools/run_tail_decision.py'
      - 'tools/bse_market_mapping.py'
      - 'tools/enrich_tail_yunai.py'
      - '.github/workflows/run-tail-decision.yml'
  schedule:
    # 北京时间工作日 14:30 主跑；14:34 / 14:38 只做冗余补跑。
    # run_tail_decision.py 对当天首个成功结果做 immutable freeze，后续补跑不会覆盖。
    - cron: '30,34,38 6 * * 1-5'

permissions:
  contents: write

concurrency:
  group: astock-tail-decision-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  tail:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 记录尾盘扫描运行编号
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONTENT=$(printf '%s' '${{ github.run_id }}' | base64 -w0)
          OLD_SHA=$(gh api repos/${{ github.repository }}/contents/latest-tail-run.txt?ref=main --jq .sha 2>/dev/null || true)
          if [ -n "$OLD_SHA" ]; then
            gh api --method PUT repos/${{ github.repository }}/contents/latest-tail-run.txt -f message='Record latest tail decision run' -f content="$CONTENT" -f sha="$OLD_SHA" -f branch='main' >/dev/null
          else
            gh api --method PUT repos/${{ github.repository }}/contents/latest-tail-run.txt -f message='Record latest tail decision run' -f content="$CONTENT" -f branch='main' >/dev/null
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 运行14:30尾盘决策扫描
        env:
          DRY_RUN: ${{ github.event_name == 'push' && '1' || '0' }}
          ALLOW_ANY_TIME: ${{ github.event_name == 'push' && '1' || '0' }}
        run: python tools/run_tail_decision.py
      - name: 合并Yunai生产网关确认
        env:
          DRY_RUN: ${{ github.event_name == 'push' && '1' || '0' }}
        run: python tools/enrich_tail_yunai.py
      - name: 保存尾盘冻结结果
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- astock_tail; then
            echo 'No tail-decision changes.'
            exit 0
          fi
          git config user.name 'astock-tail-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add astock_tail
          git commit -m 'Freeze 14:30 A-share tail decision cohort'
          git pull --rebase origin main
          git push origin HEAD:main
