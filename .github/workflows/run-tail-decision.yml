name: Run AStock 14:30-15:00 Rolling Tail Decision

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tools/run_tail_decision.py'
      - 'tools/run_tail_rolling.py'
      - 'tools/run_tail_rolling_reliable.py'
      - 'tools/bse_market_mapping.py'
      - 'tools/enrich_tail_yunai.py'
      - 'tools/sync_yunai_production.py'
      - 'tools/yunai_tail_overlay.py'
      - '.github/workflows/run-tail-decision.yml'
  schedule:
    # 北京时间工作日 14:30-14:55 每5分钟滚动重算。
    - cron: '30,35,40,45,50,55 6 * * 1-5'
    # 15:00后多次尝试 Final；即使 Actions 晚启动，可靠 wrapper 仍可用同日收盘快照恢复。
    - cron: '0,3,6,10,15,20,35 7 * * 1-5'

permissions:
  contents: write

concurrency:
  group: astock-tail-decision
  cancel-in-progress: false

jobs:
  tail:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 记录尾盘扫描运行编号
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONTENT=$(printf '%s' '${{ github.run_id }}' | base64 -w0)
          OLD_SHA=$(gh api repos/${{ github.repository }}/contents/latest-tail-run.txt?ref=main --jq .sha 2>/dev/null || true)
          if [ -n "$OLD_SHA" ]; then
            gh api --method PUT repos/${{ github.repository }}/contents/latest-tail-run.txt -f message='Record latest tail decision run' -f content="$CONTENT" -f sha="$OLD_SHA" -f branch='main' >/dev/null
          else
            gh api --method PUT repos/${{ github.repository }}/contents/latest-tail-run.txt -f message='Record latest tail decision run' -f content="$CONTENT" -f branch='main' >/dev/null
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 每5分钟重算或收盘补冻尾盘主线与筛选池
        id: rolling
        env:
          DRY_RUN: '0'
          FINAL_ONLY: ${{ github.event_name == 'push' && '1' || '0' }}
        run: |
          OUT=$(python tools/run_tail_rolling_reliable.py)
          echo "$OUT"
          STATE=$(printf '%s\n' "$OUT" | tail -n 1 | python -c 'import json,sys; print(json.load(sys.stdin).get("state", "unknown"))')
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
      - name: 刷新 Yunai 候选股实时行情与资金分布
        if: steps.rolling.outputs.state == 'tail-live-updated' || steps.rolling.outputs.state == 'tail-final-frozen'
        env:
          YUNAI_TOKEN: ${{ secrets.YUNAI_TOKEN }}
        run: python tools/sync_yunai_production.py
      - name: 合并 Yunai 二次确认
        if: steps.rolling.outputs.state == 'tail-live-updated' || steps.rolling.outputs.state == 'tail-final-frozen'
        env:
          DRY_RUN: '0'
        run: python tools/enrich_tail_yunai.py
      - name: 保存滚动快照或15:00最终结果
        if: steps.rolling.outputs.state == 'tail-live-updated' || steps.rolling.outputs.state == 'tail-final-frozen' || steps.rolling.outputs.state == 'tail-final-immutable'
        run: |
          git config user.name 'astock-tail-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add astock_tail astock_gateway/yunai_live.json astock_gateway/latest.json
          if git diff --cached --quiet; then
            echo 'No tail-decision changes.'
            exit 0
          fi
          git commit -m 'Update rolling A-share tail decision pool'
          git pull --rebase origin main
          git push origin HEAD:main
