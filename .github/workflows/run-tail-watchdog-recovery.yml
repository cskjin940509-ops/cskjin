name: Recover AStock Rolling Tail Decision

on:
  push:
    branches: [ main ]
    paths:
      - 'astock_tail/watchdog-trigger.txt'
      - '.github/workflows/run-tail-watchdog-recovery.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: astock-tail-decision
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 尾盘滚动/Final可靠恢复扫描
        id: rolling
        env:
          ALLOW_ANY_TIME: '1'
          DRY_RUN: '0'
        run: |
          OUT=$(python tools/run_tail_rolling_reliable.py)
          echo "$OUT"
          STATE=$(printf '%s\n' "$OUT" | tail -n 1 | python -c 'import json,sys; print(json.load(sys.stdin).get("state", "unknown"))')
          echo "state=$STATE" >> "$GITHUB_OUTPUT"

      # 恢复任务优先保证核心快照/Final 落盘。外部 Yunai 只在新 Final 冻结时
      # 尝试补充，失败也不能阻断核心结果保存。已存在的同日 TailFinal 会由
      # run_tail_rolling.py 的 immutable guard 直接保护，不会被恢复任务改写。
      - name: 立即保存恢复核心结果
        if: steps.rolling.outputs.state == 'tail-live-updated' || steps.rolling.outputs.state == 'tail-final-frozen' || steps.rolling.outputs.state == 'tail-final-immutable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_data_on_arrival.py tail

      - name: 刷新 Yunai 候选股确认
        if: steps.rolling.outputs.state == 'tail-final-frozen'
        continue-on-error: true
        env:
          YUNAI_TOKEN: ${{ secrets.YUNAI_TOKEN }}
        run: python tools/sync_yunai_production.py
      - name: 合并 Yunai 二次确认
        if: steps.rolling.outputs.state == 'tail-final-frozen'
        continue-on-error: true
        env:
          DRY_RUN: '0'
        run: python tools/enrich_tail_yunai.py

      - name: 保存恢复结果
        if: steps.rolling.outputs.state == 'tail-live-updated' || steps.rolling.outputs.state == 'tail-final-frozen' || steps.rolling.outputs.state == 'tail-final-immutable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_data_on_arrival.py tail

      - name: 保留失败计算产物供恢复
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tail-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: astock_tail/
          retention-days: 30
