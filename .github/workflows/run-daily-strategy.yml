name: Run AStock Daily Strategy

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: '目标交易日 YYYY-MM-DD，留空则使用最新冻结市场快照日期'
        required: false
        type: string
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/run-daily-strategy.yml'
      - 'tools/ensure_daily_close_snapshot.py'
      - 'tools/run_daily_strategy_verified.py'
      - 'tools/run_daily_strategy_verified_bse.py'
      - 'tools/run_daily_strategy_resilient_bse.py'
      - 'tools/update_strategy_tracking_display_ready.py'
      - 'tools/enrich_official_trade_metrics.py'
  schedule:
    # 北京时间收盘后自动生成正式池：15:05首次，15:15/15:25兜底。
    # 每一轮都先自行补抓并验证收盘快照，不再依赖另一个workflow先完成。
    - cron: '5,15,25 7 * * 1-5'

permissions:
  contents: write
  actions: write

concurrency:
  group: astock-daily-strategy
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 记录策略运行编号
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONTENT=$(printf '%s' '${{ github.run_id }}' | base64 -w0)
          OLD_SHA=$(gh api repos/${{ github.repository }}/contents/latest-strategy-run.txt?ref=main --jq .sha 2>/dev/null || true)
          if [ -n "$OLD_SHA" ]; then
            gh api --method PUT repos/${{ github.repository }}/contents/latest-strategy-run.txt -f message='Record latest strategy run' -f content="$CONTENT" -f sha="$OLD_SHA" -f branch='main' >/dev/null
          else
            gh api --method PUT repos/${{ github.repository }}/contents/latest-strategy-run.txt -f message='Record latest strategy run' -f content="$CONTENT" -f branch='main' >/dev/null
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 自动补抓并锁定当天收盘快照
        if: github.event_name != 'workflow_dispatch' || inputs.target_date == ''
        run: python tools/ensure_daily_close_snapshot.py

      - name: 运行时点安全 + 双源校验 + 孤立失败自动剔除的日终扫描
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          YUNAI_TOKEN: ${{ secrets.YUNAI_TOKEN }}
        run: python tools/run_daily_strategy_resilient_bse.py

      - name: 生成两两资金确认池
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          if git diff --quiet -- astock_snapshots/index.json; then
            echo 'No new verified cohort; skip pairwise augmentation.'
          else
            python tools/augment_pairwise_pools.py
          fi

      - name: 补全正式池当日交易事实
        continue-on-error: true
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          YUNAI_TOKEN: ${{ secrets.YUNAI_TOKEN }}
        run: python tools/enrich_official_trade_metrics.py

      - name: 保全已验证正式池证据（发布失败仍可恢复）
        uses: actions/upload-artifact@v4
        with:
          name: verified-official-${{ github.run_id }}-${{ github.run_attempt }}
          path: astock_snapshots/index.json
          if-no-files-found: error
          retention-days: 90

      - name: 立即发布正式池核心结果
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_data_on_arrival.py official
