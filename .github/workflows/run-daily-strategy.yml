name: Run AStock Daily Strategy

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: '目标交易日 YYYY-MM-DD，留空则使用最新冻结市场快照日期'
        required: false
        type: string
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/run-daily-strategy.yml'
      - 'tools/run_daily_strategy_verified.py'
      - 'tools/run_daily_strategy_verified_bse.py'
      - 'tools/update_strategy_tracking_display_ready.py'
      - 'tools/enrich_official_trade_metrics.py'
  schedule:
    # 北京时间收盘后尽快冻结：15:05首次尝试，15:15/15:25仅做数据延迟兜底。
    # 任一轮通过当日冻结快照 + 至少双源未复权OHLC校验后即生成正式池；后续不改写原始名单。
    - cron: '5,15,25 7 * * 1-5'

permissions:
  contents: write

concurrency:
  group: astock-daily-strategy
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 记录策略运行编号
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONTENT=$(printf '%s' '${{ github.run_id }}' | base64 -w0)
          OLD_SHA=$(gh api repos/${{ github.repository }}/contents/latest-strategy-run.txt?ref=main --jq .sha 2>/dev/null || true)
          if [ -n "$OLD_SHA" ]; then
            gh api --method PUT repos/${{ github.repository }}/contents/latest-strategy-run.txt -f message='Record latest strategy run' -f content="$CONTENT" -f sha="$OLD_SHA" -f branch='main' >/dev/null
          else
            gh api --method PUT repos/${{ github.repository }}/contents/latest-strategy-run.txt -f message='Record latest strategy run' -f content="$CONTENT" -f branch='main' >/dev/null
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 运行时点安全 + 至少双源校验的日终扫描
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          YUNAI_TOKEN: ${{ secrets.YUNAI_TOKEN }}
        run: python tools/run_daily_strategy_verified_bse.py
      - name: 生成两两资金确认池
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          if git diff --quiet -- astock_snapshots/index.json; then
            echo 'No new verified cohort; skip pairwise augmentation.'
          else
            python tools/augment_pairwise_pools.py
          fi
      - name: 补全正式池当日交易事实
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          YUNAI_TOKEN: ${{ secrets.YUNAI_TOKEN }}
        run: python tools/enrich_official_trade_metrics.py
      - name: 更新正式与参考批次后续表现
        env:
          YUNAI_TOKEN: ${{ secrets.YUNAI_TOKEN }}
        run: python tools/update_strategy_tracking_display_ready.py
      - name: 保存正式股票池与收益跟踪
        run: |
          if git diff --quiet -- astock_snapshots/index.json; then
            echo 'No strategy/tracking changes.'
            exit 0
          fi
          git config user.name 'astock-strategy-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add astock_snapshots/index.json
          git commit -m 'Update verified daily A-share cohort and tracking'
          git pull --rebase origin main
          git push origin HEAD:main
