name: Audit Legacy AStock Cohorts

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tools/audit_legacy_cohorts.py'
      - '.github/workflows/audit-legacy-cohorts.yml'

permissions:
  contents: write

concurrency:
  group: astock-legacy-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 记录审计运行编号
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONTENT=$(printf '%s' '${{ github.run_id }}' | base64 -w0)
          OLD_SHA=$(gh api repos/${{ github.repository }}/contents/latest-legacy-audit-run.txt?ref=main --jq .sha 2>/dev/null || true)
          if [ -n "$OLD_SHA" ]; then
            gh api --method PUT repos/${{ github.repository }}/contents/latest-legacy-audit-run.txt -f message='Record latest legacy audit run' -f content="$CONTENT" -f sha="$OLD_SHA" -f branch='main' >/dev/null
          else
            gh api --method PUT repos/${{ github.repository }}/contents/latest-legacy-audit-run.txt -f message='Record latest legacy audit run' -f content="$CONTENT" -f branch='main' >/dev/null
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 审计旧版正式批次
        run: python tools/audit_legacy_cohorts.py
      - name: 保存审计标记
        run: |
          if git diff --quiet -- astock_snapshots/index.json; then
            echo 'No audit changes.'
            exit 0
          fi
          git config user.name 'astock-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add astock_snapshots/index.json
          git commit -m 'Audit legacy A-share strategy cohorts'
          git pull --rebase origin main
          git push origin HEAD:main
