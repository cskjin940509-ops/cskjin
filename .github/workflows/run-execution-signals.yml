name: Run AStock Execution Signals

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tools/run_execution_signals.py'
      - '.github/workflows/run-execution-signals.yml'
  schedule:
    # 北京时间交易日上午/下午每5分钟。脚本自身区分PREOPEN/午休/LIVE/收盘。
    - cron: '*/5 1-3 * * 1-5'
    - cron: '*/5 5-7 * * 1-5'

permissions:
  contents: write

concurrency:
  group: astock-execution-signals
  cancel-in-progress: true

jobs:
  execution:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: 记录运行编号
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONTENT=$(printf '%s' '${{ github.run_id }}' | base64 -w0)
          OLD_SHA=$(gh api repos/${{ github.repository }}/contents/latest-execution-run.txt?ref=main --jq .sha 2>/dev/null || true)
          if [ -n "$OLD_SHA" ]; then
            gh api --method PUT repos/${{ github.repository }}/contents/latest-execution-run.txt -f message='Record latest execution run' -f content="$CONTENT" -f sha="$OLD_SHA" -f branch='main' >/dev/null
          else
            gh api --method PUT repos/${{ github.repository }}/contents/latest-execution-run.txt -f message='Record latest execution run' -f content="$CONTENT" -f branch='main' >/dev/null
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 生成实盘执行信号
        env:
          YUNAI_TOKEN: ${{ secrets.YUNAI_TOKEN }}
        run: python tools/run_execution_signals.py
      - name: 保存执行层快照
        run: |
          if [ -z "$(git status --porcelain -- astock_execution)" ]; then
            echo 'No execution changes.'
            exit 0
          fi
          git config user.name 'astock-execution-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add astock_execution
          git commit -m 'Update A-share execution guidance snapshot'
          git pull --rebase origin main
          git push origin HEAD:main
