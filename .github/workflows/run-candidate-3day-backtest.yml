name: Run Candidate 3-Day Backtest
on:
  push:
    paths:
      - '.github/workflows/run-candidate-3day-backtest.yml'
      - 'tools/backtest_candidate_3day_fast.py'
      - 'tools/backtest_candidate_8day.py'
      - 'tools/backtest_candidate_8day_fast.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install market data dependency
        run: python -m pip install --quiet pytdx==1.72
      - name: Run 3-day backtest
        run: python tools/backtest_candidate_3day_fast.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtests/candidate_3day_backtest_20261007.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Publish candidate 3-day backtest result"
            git pull --rebase origin main
            git push
          fi
