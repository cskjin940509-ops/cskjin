name: Update AStock B1 Margin / B2 ETF / 开盘前预测池

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tools/collect_slow_money_factors.py'
      - 'tools/collect_slow_money_factors_v2.py'
      - 'tools/test_free_sentiment_inputs.py'
      - 'tools/slow_money_factors.py'
      - 'tools/generate_premarket_prediction.py'
      - 'tools/backfill_etf_485.py'
      - 'tools/test_backfill_etf_485.py'
      - '.github/workflows/update-slow-money-factors.yml'
  schedule:
    # 北京时间工作日08:20起预取；08:40/08:55/09:10/09:20重试。
    # 每轮采集完成后立即重算四指数，最后一轮仍预留约10分钟给9:30开盘决策。
    - cron: '20,40,55 0 * * 1-5'
    - cron: '10,20,35 1 * * 1-5'
    # 独立补采延迟发布的日频数据，不占用实时雷达队列。
    - cron: '5 2,3,5,6,7 * * 1-5'

permissions:
  contents: write
  actions: write

concurrency:
  group: astock-slow-money-factors
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 记录慢资金运行编号
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONTENT=$(printf '%s' '${{ github.run_id }}' | base64 -w0)
          OLD_SHA=$(gh api repos/${{ github.repository }}/contents/latest-slow-money-run.txt?ref=main --jq .sha 2>/dev/null || true)
          if [ -n "$OLD_SHA" ]; then
            gh api --method PUT repos/${{ github.repository }}/contents/latest-slow-money-run.txt -f message='Record latest slow-money run' -f content="$CONTENT" -f sha="$OLD_SHA" -f branch='main' >/dev/null
          else
            gh api --method PUT repos/${{ github.repository }}/contents/latest-slow-money-run.txt -f message='Record latest slow-money run' -f content="$CONTENT" -f branch='main' >/dev/null
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装交易所数据适配器
        run: python -m pip install --quiet 'akshare>=1.18.15,<2'
      - name: 校验免费情绪数据输入
        run: python -m unittest tools/test_free_sentiment_inputs.py
      - name: 校验指定数据中转接口
        env:
          STOCK_API_TOKEN: ${{ secrets.STOCK_API_TOKEN }}
          STOCK_API_URL: https://jiaoch.top/
        run: python tools/check_stock_proxy.py
      - name: 回补ETF 485日份额横截面（断点续传）
        env:
          STOCK_API_TOKEN: ${{ secrets.STOCK_API_TOKEN }}
          STOCK_API_URL: https://jiaoch.top/
          ETF_BACKFILL_WORKERS: 6
        run: python tools/backfill_etf_485.py
      - name: 拉取两融与ETF份额慢资金数据
        env:
          STOCK_API_TOKEN: ${{ secrets.STOCK_API_TOKEN }}
          STOCK_API_URL: https://jiaoch.top/
        run: python tools/collect_slow_money_factors_v2.py
      - name: 慢资金到达后立即重算四个盘前情绪指数
        run: python tools/publish_four_sentiment_daily.py
      - name: 慢资金到达立即发布并通知雷达
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_data_on_arrival.py factors
      - name: 生成开盘前提前预测池
        run: python tools/generate_premarket_prediction.py
      - name: 保存慢资金因子与开盘前预测池并即时同步
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_data_on_arrival.py factors
