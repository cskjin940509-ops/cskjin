name: Update AStock B1 Margin / B2 ETF / 开盘前预测池

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tools/collect_slow_money_factors.py'
      - 'tools/collect_slow_money_factors_v2.py'
      - 'tools/slow_money_factors.py'
      - 'tools/generate_premarket_prediction.py'
      - '.github/workflows/update-slow-money-factors.yml'
  schedule:
    # 北京时间工作日 08:55 首次更新；09:05 / 09:15 重试，保证开盘前尽量拿到上一交易日B1/B2。
    - cron: '55 0 * * 1-5'
    - cron: '5,15 1 * * 1-5'

permissions:
  contents: write

concurrency:
  group: astock-slow-money-factors
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 记录慢资金运行编号
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONTENT=$(printf '%s' '${{ github.run_id }}' | base64 -w0)
          OLD_SHA=$(gh api repos/${{ github.repository }}/contents/latest-slow-money-run.txt?ref=main --jq .sha 2>/dev/null || true)
          if [ -n "$OLD_SHA" ]; then
            gh api --method PUT repos/${{ github.repository }}/contents/latest-slow-money-run.txt -f message='Record latest slow-money run' -f content="$CONTENT" -f sha="$OLD_SHA" -f branch='main' >/dev/null
          else
            gh api --method PUT repos/${{ github.repository }}/contents/latest-slow-money-run.txt -f message='Record latest slow-money run' -f content="$CONTENT" -f branch='main' >/dev/null
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装交易所数据适配器
        run: python -m pip install --quiet 'akshare>=1.18.15,<2'
      - name: 拉取两融与ETF份额慢资金数据
        run: python tools/collect_slow_money_factors_v2.py
      - name: 生成开盘前提前预测池
        run: python tools/generate_premarket_prediction.py
      - name: 保存慢资金因子与开盘前预测池
        run: |
          git config user.name 'astock-slow-money-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add astock_factors astock_premarket
          if git diff --cached --quiet; then
            echo 'No slow-money or premarket prediction changes.'
            exit 0
          fi
          git commit -m 'Update B1/B2 slow-money and premarket prediction pool'
          pushed=0
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            sleep 2
          done
          test "$pushed" -eq 1
