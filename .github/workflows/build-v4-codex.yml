name: Build AStock v4 Codex

on:
  push:
    branches: [ codex/v4-latest-framework ]
    paths-ignore:
      - ci-output/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify production backend contracts
        run: python tools/verify_backend_contract.py
      - name: Assemble and retain diagnostics
        shell: bash
        run: |
          mkdir -p ci-output
          set +e
          gradle :app:assembleDebug --stacktrace > ci-output/build.log 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > ci-output/build-status.txt
          if [ "$status" -eq 0 ]; then
            cp app/build/outputs/apk/debug/app-debug.apk ci-output/AStockStrategy-v4.3-fund-nav-capacity-20m.apk
          else
            rm -f ci-output/AStockStrategy-v4.3-fund-nav-capacity-20m.apk
          fi
      - name: Publish branch-local build result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci-output/build.log ci-output/build-status.txt
          if [ -f ci-output/AStockStrategy-v4.3-fund-nav-capacity-20m.apk ]; then
            git add -f ci-output/AStockStrategy-v4.3-fund-nav-capacity-20m.apk
          else
            git rm --ignore-unmatch ci-output/AStockStrategy-v4.3-fund-nav-capacity-20m.apk
          fi
          git diff --cached --quiet && exit 0
          git commit -m "ci: publish v4 build result [skip ci]"
          git push origin HEAD:codex/v4-latest-framework
