name: Build Android and Windows together
on:
  push:
    branches: [codex/v4-latest-framework, codex/windows-android-release]
    paths-ignore: ['ci-output/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: astock-apps-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - run: python tools/verify_shared_release.py
      - run: python tools/verify_backend_contract.py
      - id: version
        run: echo "version=$(sed -n 's/^versionName=//p' version.properties)" >> "$GITHUB_OUTPUT"
  android:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: astock-android-signing-v47
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Build Android from shared sources
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare Android package
        env:
          APP_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/AStockSelection-$APP_VERSION-Android.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "dist/AStockSelection-$APP_VERSION-Android.apk" > dist/android-signature.txt
          printf '%s\n' "$GITHUB_SHA" > dist/android-source-sha.txt
      - uses: actions/upload-artifact@v4
        with: {name: android-package, path: dist/, if-no-files-found: error}
  windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Ensure Windows installer tools
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --version=3.14.1 -y --no-progress --allow-downgrade
            if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
            Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset*' | ForEach-Object { "$($_.FullName)\bin" >> $env:GITHUB_PATH }
          }
      - name: Build Windows installer with bundled runtime
        shell: pwsh
        run: |
          gradle -PdesktopOnly=true :desktop:packageExe :desktop:createDistributable --stacktrace
          $buildCode = $LASTEXITCODE
          if ($buildCode -ne 0) {
            Get-ChildItem 'desktop/build/compose/logs' -Recurse -Filter '*.txt' | ForEach-Object { Write-Output $_.FullName; Get-Content $_.FullName }
            exit $buildCode
          }
      - name: Verify packaged storage and UI launch
        shell: pwsh
        run: |
          New-Item dist -ItemType Directory -Force | Out-Null
          $exe = Resolve-Path 'desktop/build/compose/binaries/main/app/AStockSelection/AStockSelection.exe'
          $env:ASTOCK_SELF_TEST_OUTPUT = "$pwd/dist/desktop-self-test.txt"
          $test = Start-Process $exe -ArgumentList '--self-test' -PassThru
          if (-not $test.WaitForExit(90000)) { $test.Kill(); throw 'Storage test timed out' }
          if ($test.ExitCode -ne 0 -or -not (Test-Path $env:ASTOCK_SELF_TEST_OUTPUT)) { throw 'Runtime test failed' }
          $env:ASTOCK_SMOKE_OUTPUT = "$pwd/dist/desktop-smoke.png"
          $smoke = Start-Process $exe -ArgumentList '--smoke-test' -PassThru
          if (-not $smoke.WaitForExit(90000)) { $smoke.Kill(); throw 'UI launch timed out' }
          if ($smoke.ExitCode -ne 0 -or -not (Test-Path $env:ASTOCK_SMOKE_OUTPUT)) { throw 'UI launch failed' }
      - name: Verify silent installer and installed application
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'desktop/build/compose/binaries/main/exe/*.exe' | Select-Object -First 1
          $install = Start-Process $installer.FullName -ArgumentList '/quiet','/norestart' -PassThru
          if (-not $install.WaitForExit(120000)) { $install.Kill(); throw 'Installer timed out' }
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $link = Get-ChildItem "$env:APPDATA/Microsoft/Windows/Start Menu/Programs" -Filter 'AStockSelection.lnk' -Recurse | Select-Object -First 1
          if (-not $link) { throw 'Installer did not create the Start Menu shortcut' }
          $shell = New-Object -ComObject WScript.Shell
          $installed = $shell.CreateShortcut($link.FullName).TargetPath
          if (-not (Test-Path $installed)) { throw 'Installed executable missing' }
          $env:ASTOCK_SELF_TEST_OUTPUT = "$pwd/dist/installed-self-test.txt"
          $test = Start-Process $installed -ArgumentList '--self-test' -PassThru
          if (-not $test.WaitForExit(90000)) { $test.Kill(); throw 'Installed application timed out' }
          if ($test.ExitCode -ne 0 -or -not (Test-Path $env:ASTOCK_SELF_TEST_OUTPUT)) { throw 'Installed application test failed' }
      - name: Prepare Windows package
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          Copy-Item (Get-ChildItem 'desktop/build/compose/binaries/main/exe/*.exe' | Select-Object -First 1) "dist/AStockSelection-$env:APP_VERSION-Windows-x64-Setup.exe"
          Set-Content dist/windows-source-sha.txt $env:GITHUB_SHA
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: windows-package, path: dist/, if-no-files-found: warn}
  release:
    needs: [verify, android, windows]
    if: github.ref == 'refs/heads/codex/v4-latest-framework'
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: dist, merge-multiple: true}
      - name: Publish both packages as one version
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          test "$(cat dist/android-source-sha.txt | tr -d '\r\n')" = "$GITHUB_SHA"
          test "$(cat dist/windows-source-sha.txt | tr -d '\r\n')" = "$GITHUB_SHA"
          test -s "dist/AStockSelection-$APP_VERSION-Android.apk"
          test -s "dist/AStockSelection-$APP_VERSION-Windows-x64-Setup.exe"
          cd dist
          sha256sum *.apk *.exe > SHA256SUMS.txt
          cd ..
          PREVIOUS=$(gh release list --json tagName,isDraft --jq '.[] | select(.isDraft == false and (.tagName | startswith("apps-v"))) | .tagName' | head -n 1)
          if [ -n "$PREVIOUS" ]; then
            gh release download "$PREVIOUS" --pattern android-signature.txt --dir previous-signature
            diff <(grep 'Signer #1 certificate SHA-256 digest:' previous-signature/android-signature.txt) <(grep 'Signer #1 certificate SHA-256 digest:' dist/android-signature.txt)
          fi
          TAG="apps-v$APP_VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Version exists: bump version.properties before releasing new code.'
            exit 1
          fi
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "A股筛选池 $APP_VERSION · Windows + Android" --notes-file RELEASE_NOTES.md --draft
          gh release edit "$TAG" --draft=false --latest
