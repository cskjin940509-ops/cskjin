name: Import Yunai OpenAPI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tools/import_yunai_openapi.py'
      - '.github/workflows/import-yunai-openapi.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 记录导入运行编号
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONTENT=$(printf '%s' '${{ github.run_id }}' | base64 -w0)
          OLD_SHA=$(gh api repos/${{ github.repository }}/contents/latest-yunai-openapi-run.txt?ref=main --jq .sha 2>/dev/null || true)
          if [ -n "$OLD_SHA" ]; then
            gh api --method PUT repos/${{ github.repository }}/contents/latest-yunai-openapi-run.txt -f message='Record latest Yunai OpenAPI import run' -f content="$CONTENT" -f sha="$OLD_SHA" -f branch='main' >/dev/null
          else
            gh api --method PUT repos/${{ github.repository }}/contents/latest-yunai-openapi-run.txt -f message='Record latest Yunai OpenAPI import run' -f content="$CONTENT" -f branch='main' >/dev/null
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 导入 quant-market OpenAPI
        env:
          YUNAI_TOKEN: ${{ secrets.YUNAI_TOKEN }}
        run: python tools/import_yunai_openapi.py
      - name: 保存接口清单
        run: |
          git config user.name 'astock-yunai-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add astock_gateway/yunai_openapi.json
          if git diff --cached --quiet; then
            echo 'No Yunai OpenAPI changes.'
            exit 0
          fi
          git commit -m 'Import Yunai quant-market OpenAPI inventory'
          git pull --rebase origin main
          git push origin HEAD:main
