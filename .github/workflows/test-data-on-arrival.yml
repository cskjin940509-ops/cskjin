name: Verify immediate data publication
on:
  workflow_dispatch:
  push:
    branches: [codex/process-data-on-arrival]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'tools/publish_data_on_arrival.py'
      - 'tools/tracking_arrival_gate.py'
      - 'tools/enrich_slow_money_factors.py'
      - 'tools/test_data_on_arrival.py'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML==6.0.3'
      - name: Verify publication, event routing and trading regressions offline
        run: |
          python -m unittest tools/test_data_on_arrival.py tools/test_selection_research_v46.py tools/test_selection_v45.py tools/test_ai_shadow_portfolio.py
