name: Verify AStock Daily Price

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: '交易日 YYYY-MM-DD'
        required: false
        default: '2026-08-18'
        type: string
      symbol:
        description: 'A股代码'
        required: false
        default: '002371'
        type: string
  push:
    branches: [ main ]
    paths:
      - 'tools/verify_daily_price.py'
      - '.github/workflows/verify-market-price.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 记录校验运行编号
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONTENT=$(printf '%s' '${{ github.run_id }}' | base64 -w0)
          OLD_SHA=$(gh api repos/${{ github.repository }}/contents/latest-price-verify-run.txt?ref=main --jq .sha 2>/dev/null || true)
          if [ -n "$OLD_SHA" ]; then
            gh api --method PUT repos/${{ github.repository }}/contents/latest-price-verify-run.txt -f message='Record latest price verify run' -f content="$CONTENT" -f sha="$OLD_SHA" -f branch='main' >/dev/null
          else
            gh api --method PUT repos/${{ github.repository }}/contents/latest-price-verify-run.txt -f message='Record latest price verify run' -f content="$CONTENT" -f branch='main' >/dev/null
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 双源核对实际成交价
        env:
          TARGET_DATE: ${{ inputs.target_date || '2026-08-18' }}
          SYMBOL: ${{ inputs.symbol || '002371' }}
        run: |
          set +e
          python tools/verify_daily_price.py
          echo $? > /tmp/verify_code
          exit 0
      - name: 保存校验报告
        run: |
          if git diff --quiet -- astock_gateway/validation; then
            echo 'No validation report changes.'
          else
            git config user.name 'astock-validator-bot'
            git config user.email 'actions@users.noreply.github.com'
            git add astock_gateway/validation
            git commit -m 'Validate A-share price across sources'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: 强制暴露校验失败
        run: |
          CODE=$(cat /tmp/verify_code)
          if [ "$CODE" != "0" ]; then
            echo 'Cross-source price validation failed.'
            exit "$CODE"
          fi
