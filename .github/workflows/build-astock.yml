name: Build AStock APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Record run id
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONTENT=$(printf '%s' '${{ github.run_id }}' | base64 -w0)
          OLD_SHA=$(gh api repos/${{ github.repository }}/contents/latest-run.txt?ref=main --jq .sha 2>/dev/null || true)
          if [ -n "$OLD_SHA" ]; then
            gh api --method PUT repos/${{ github.repository }}/contents/latest-run.txt -f message='Record latest APK build run' -f content="$CONTENT" -f sha="$OLD_SHA" -f branch='main' >/dev/null
          else
            gh api --method PUT repos/${{ github.repository }}/contents/latest-run.txt -f message='Record latest APK build run' -f content="$CONTENT" -f branch='main' >/dev/null
          fi
      - uses: actions/checkout@v4
        with:
          ref: astock-build-v0.5
      - name: Patch v0.5 source for clean build
        run: |
          rm -f app/src/main/java/com/rui/astockstrategy/V04Activity.kt
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/src/main/java/com/rui/astockstrategy/v5/V5Activity.kt')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'label={Text(t.label)})}}}}': 'label={Text(t.label)})}}}',
              'suspend fun fetchSnapshots():List<Snapshot>=': 'suspend fun fetchSnapshots(): List<Snapshot> =',
              'suspend fun fetchQuotes(symbols:List<String>):Map<String,Quote>=': 'suspend fun fetchQuotes(symbols: List<String>): Map<String, Quote> =',
              'suspend fun fetchBoards(type:String):List<Board>=': 'suspend fun fetchBoards(type: String): List<Board> =',
              'suspend fun fetchMembers(boardCode:String):List<Member>=': 'suspend fun fetchMembers(boardCode: String): List<Member> =',
              '(b.change?:0.0)>2': '(b.change ?: 0.0) > 2',
              '(b.change?:0.0)>0': '(b.change ?: 0.0) > 0',
              '(b.change?:0.0)<-2': '(b.change ?: 0.0) < -2',
              '(b.change?:0.0)<0': '(b.change ?: 0.0) < 0',
              'abs(v.toDouble())<2': 'abs(v.toDouble()) < 2',
              'if(v>=0)': 'if(v >= 0)',
              'if(v<0)': 'if(v < 0)',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          s = re.sub(r'(?<=\d)->', ' ->', s)
          p.write_text(s, encoding='utf-8')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AStockStrategy-v0.5-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
