name: Build AStock APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Record run id
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONTENT=$(printf '%s' '${{ github.run_id }}' | base64 -w0)
          OLD_SHA=$(gh api repos/${{ github.repository }}/contents/latest-run.txt?ref=main --jq .sha 2>/dev/null || true)
          if [ -n "$OLD_SHA" ]; then
            gh api --method PUT repos/${{ github.repository }}/contents/latest-run.txt -f message='Record latest APK build run' -f content="$CONTENT" -f sha="$OLD_SHA" -f branch='main' >/dev/null
          else
            gh api --method PUT repos/${{ github.repository }}/contents/latest-run.txt -f message='Record latest APK build run' -f content="$CONTENT" -f branch='main' >/dev/null
          fi
      - uses: actions/checkout@v4
        with:
          ref: astock-build-v0.6-live
      - name: Add history replay and post-close dashboard
        run: |
          rm -f app/src/main/java/com/rui/astockstrategy/V04Activity.kt
          rm -f app/src/main/java/com/rui/astockstrategy/v5/V5Activity.kt
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/rui/astockstrategy/v6/V6Activity.kt')
          s=p.read_text(encoding='utf-8')

          history_needle='''        item { CardBlock { Key("日期", snap.date); Key("状态", snap.status); Key("Regime", snap.regime); Key("主线", snap.mainlines.joinToString(" / ").ifBlank { "—" }) } }'''
          history_repl=history_needle+'''\n        item { HistoricalMarketReplay(snap.date) }\n        item { Title("Strategy Review（策略回顾）") }'''
          if 'HistoricalMarketReplay(snap.date)' not in s:
              if history_needle not in s:
                  raise SystemExit('history insertion point not found')
              s=s.replace(history_needle,history_repl,1)

          today_old='''        item {\n            StatusCard(now, quoteOkAt, boardOkAt, s)\n        }\n        item { Title("Intraday Preview（盘中预览）") }\n        item {\n            Notice("盘中只用当前可实时取得的公开行情生成主线候选，不冒充正式 B1/B2/B3/B4。正式 Daily Cohort 收盘后另行冻结。")\n        }'''
          today_new='''        item {\n            StatusCard(now, quoteOkAt, boardOkAt, s)\n        }\n        if (!marketOpenNow()) {\n            item { PostCloseDashboard(quotes, preview, s) }\n            item { Title("Close Preview（收盘主线预览）") }\n            item { Notice("15:00 后优先展示当天真实收盘行情和板块收盘截面；Official Daily Cohort 尚未完成时只标记策略计算中，不留空白，也不拿昨日名单冒充今日结果。") }\n        } else {\n            item { Title("Intraday Preview（盘中预览）") }\n            item { Notice("盘中只用当前可实时取得的公开行情生成主线候选，不冒充正式 B1/B2/B3/B4。正式 Daily Cohort 收盘后另行冻结。") }\n        }'''
          if 'PostCloseDashboard(quotes, preview, s)' not in s:
              if today_old not in s:
                  raise SystemExit('today insertion point not found')
              s=s.replace(today_old,today_new,1)

          s=s.replace('item { Title("实时${type}热力图") }','item { Title(if (marketOpenNow()) "实时${type}热力图" else "收盘${type}热力图") }')
          p.write_text(s,encoding='utf-8')

          h=Path('app/src/main/java/com/rui/astockstrategy/v6/HistoricalReplay.kt')
          hs=h.read_text(encoding='utf-8')
          hs=hs.replace('"该日$title热力图尚未冻结/回填。不会显示今天的实时板块数据。"','"该日${title}热力图尚未冻结/回填。不会显示今天的实时板块数据。"')
          h.write_text(hs,encoding='utf-8')

          g=Path('app/build.gradle.kts')
          gs=g.read_text(encoding='utf-8')
          gs=gs.replace('versionCode = 7','versionCode = 9').replace('versionName = "0.7.0"','versionName = "0.8.0"')
          g.write_text(gs,encoding='utf-8')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: astock-debug-signing-v1
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AStockStrategy-v0.8-stable-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
