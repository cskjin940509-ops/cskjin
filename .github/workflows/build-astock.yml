name: Build AStock APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Record run id
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONTENT=$(printf '%s' '${{ github.run_id }}' | base64 -w0)
          OLD_SHA=$(gh api repos/${{ github.repository }}/contents/latest-run.txt?ref=main --jq .sha 2>/dev/null || true)
          if [ -n "$OLD_SHA" ]; then
            gh api --method PUT repos/${{ github.repository }}/contents/latest-run.txt -f message='Record latest APK build run' -f content="$CONTENT" -f sha="$OLD_SHA" -f branch='main' >/dev/null
          else
            gh api --method PUT repos/${{ github.repository }}/contents/latest-run.txt -f message='Record latest APK build run' -f content="$CONTENT" -f branch='main' >/dev/null
          fi
      - uses: actions/checkout@v4
        with:
          ref: astock-build-v0.6-live
      - name: Keep current activity and add history replay
        run: |
          rm -f app/src/main/java/com/rui/astockstrategy/V04Activity.kt
          rm -f app/src/main/java/com/rui/astockstrategy/v5/V5Activity.kt
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/rui/astockstrategy/v6/V6Activity.kt')
          s=p.read_text(encoding='utf-8')
          needle='''        item { CardBlock { Key("日期", snap.date); Key("状态", snap.status); Key("Regime", snap.regime); Key("主线", snap.mainlines.joinToString(" / ").ifBlank { "—" }) } }'''
          repl=needle+'''\n        item { HistoricalMarketReplay(snap.date) }\n        item { Title("Strategy Review（策略回顾）") }'''
          if 'HistoricalMarketReplay(snap.date)' not in s:
              if needle not in s:
                  raise SystemExit('history insertion point not found')
              s=s.replace(needle,repl,1)
          p.write_text(s,encoding='utf-8')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AStockStrategy-v0.7-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
