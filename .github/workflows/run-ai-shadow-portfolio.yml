name: Run AI Shadow Portfolio

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tools/run_ai_shadow_portfolio.py'
      - '.github/workflows/run-ai-shadow-portfolio.yml'
      - 'astock_ai_portfolio/trigger.txt'
  schedule:
    # 滞后全天主线雷达约2分钟执行，避免与雷达更新抢同一个时点。
    # 09:32-09:57 CST
    - cron: '32,37,42,47,52,57 1 * * 1-5'
    # 10:02-10:57 CST
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 2 * * 1-5'
    # 11:02-11:27 CST
    - cron: '2,7,12,17,22,27 3 * * 1-5'
    # 13:02-14:57 CST
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 5-6 * * 1-5'
    # 收盘后只更新净值，不允许产生交易成交。
    - cron: '2,7,17 7 * * 1-5'

permissions:
  contents: write

concurrency:
  group: astock-ai-shadow-portfolio
  cancel-in-progress: false

jobs:
  ai-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 记录影子实盘运行编号
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONTENT=$(printf '%s' '${{ github.run_id }}' | base64 -w0)
          OLD_SHA=$(gh api repos/${{ github.repository }}/contents/latest-ai-shadow-run.txt?ref=main --jq .sha 2>/dev/null || true)
          if [ -n "$OLD_SHA" ]; then
            gh api --method PUT repos/${{ github.repository }}/contents/latest-ai-shadow-run.txt -f message='Record latest AI shadow run' -f content="$CONTENT" -f sha="$OLD_SHA" -f branch='main' >/dev/null
          else
            gh api --method PUT repos/${{ github.repository }}/contents/latest-ai-shadow-run.txt -f message='Record latest AI shadow run' -f content="$CONTENT" -f branch='main' >/dev/null
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: AI影子实盘滚动决策
        run: python tools/run_ai_shadow_portfolio.py
      - name: 保存AI影子实盘账本与净值
        run: |
          git config user.name 'astock-ai-shadow-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add astock_ai_portfolio
          if git diff --cached --quiet; then
            echo 'No AI shadow portfolio changes.'
            exit 0
          fi
          git commit -m 'Update AI shadow portfolio point-in-time ledger'
          git pull --rebase origin main
          git push origin HEAD:main
