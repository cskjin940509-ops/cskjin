name: Run AStock Live Trade Plan

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tools/update_trade_plan.py'
      - 'tools/run_trade_plan_resilient.py'
      - 'tools/augment_trade_plan_market_setups.py'
      - '.github/workflows/run-trade-plan.yml'
  schedule:
    - cron: '*/5 1-3 * * 1-5'
    - cron: '*/5 5-7 * * 1-5'

permissions:
  contents: write
  actions: write

concurrency:
  group: astock-live-trade-plan
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 记录交易计划运行编号
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONTENT=$(printf '%s' '${{ github.run_id }}' | base64 -w0)
          OLD_SHA=$(gh api repos/${{ github.repository }}/contents/latest-trade-plan-run.txt?ref=main --jq .sha 2>/dev/null || true)
          if [ -n "$OLD_SHA" ]; then
            gh api --method PUT repos/${{ github.repository }}/contents/latest-trade-plan-run.txt -f message='Record latest trade plan run' -f content="$CONTENT" -f sha="$OLD_SHA" -f branch='main' >/dev/null
          else
            gh api --method PUT repos/${{ github.repository }}/contents/latest-trade-plan-run.txt -f message='Record latest trade plan run' -f content="$CONTENT" -f branch='main' >/dev/null
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 计算正式池实时交易计划
        env:
          FORCE_SNAPSHOT: ${{ github.event_name == 'push' && '1' || '0' }}
        run: python tools/run_trade_plan_resilient.py
      - name: 立即发布正式池交易计划
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_data_on_arrival.py trade-plan

      - name: Official无买点时做全A历史形态精筛
        run: python tools/augment_trade_plan_market_setups.py
      - name: 补充发布历史形态筛选结果
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_data_on_arrival.py trade-plan
