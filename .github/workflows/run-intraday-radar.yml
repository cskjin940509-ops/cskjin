name: Run AStock All-Day Early Mainline Radar

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tools/run_intraday_radar.py'
      - 'tools/enrich_intraday_radar_yunai.py'
      - 'tools/enrich_slow_money_factors.py'
      - 'tools/slow_money_factors.py'
      - 'astock_factors/latest.json'
      - 'tools/run_ai_shadow_portfolio.py'
      - 'tools/enrich_ai_shadow_benchmarks.py'
      - '.github/workflows/run-intraday-radar.yml'
  schedule:
    # A股上午 09:30-11:30 CST = 01:30-03:30 UTC，每5分钟。
    - cron: '30,35,40,45,50,55 1 * * 1-5'
    - cron: '*/5 2 * * 1-5'
    - cron: '0,5,10,15,20,25,30 3 * * 1-5'
    # A股下午 13:00-14:55 CST = 05:00-06:55 UTC，每5分钟。
    - cron: '*/5 5-6 * * 1-5'
    # 15:00 Final + 延迟兜底；智能账户此时只更新净值，不允许产生收盘后成交。
    - cron: '0,5,10,20 7 * * 1-5'

permissions:
  contents: write

concurrency:
  group: astock-intraday-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 记录雷达运行编号
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONTENT=$(printf '%s' '${{ github.run_id }}' | base64 -w0)
          OLD_SHA=$(gh api repos/${{ github.repository }}/contents/latest-radar-run.txt?ref=main --jq .sha 2>/dev/null || true)
          if [ -n "$OLD_SHA" ]; then
            gh api --method PUT repos/${{ github.repository }}/contents/latest-radar-run.txt -f message='Record latest radar run' -f content="$CONTENT" -f sha="$OLD_SHA" -f branch='main' >/dev/null
          else
            gh api --method PUT repos/${{ github.repository }}/contents/latest-radar-run.txt -f message='Record latest radar run' -f content="$CONTENT" -f branch='main' >/dev/null
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 从开盘起滚动主线形成雷达
        id: radar
        run: |
          OUT=$(python tools/run_intraday_radar.py)
          echo "$OUT"
          STATE=$(printf '%s\n' "$OUT" | tail -n 1 | python -c 'import json,sys; print(json.load(sys.stdin).get("state", "unknown"))')
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
      - name: 云AI独立行情与资金确认
        if: steps.radar.outputs.state == 'radar-live-updated' || steps.radar.outputs.state == 'radar-final-frozen'
        env:
          YUNAI_TOKEN: ${{ secrets.YUNAI_TOKEN }}
        run: python tools/enrich_intraday_radar_yunai.py
      - name: 接入B1两融与B2 ETF慢资金因子
        if: steps.radar.outputs.state == 'radar-live-updated' || steps.radar.outputs.state == 'radar-final-frozen' || steps.radar.outputs.state == 'radar-final-immutable'
        run: python tools/enrich_slow_money_factors.py
      - name: 智能影子实盘同步决策与净值
        if: steps.radar.outputs.state == 'radar-live-updated' || steps.radar.outputs.state == 'radar-final-frozen' || steps.radar.outputs.state == 'radar-final-immutable'
        run: python tools/run_ai_shadow_portfolio.py
      - name: 更新大盘与原始候选池同期基准
        if: steps.radar.outputs.state == 'radar-live-updated' || steps.radar.outputs.state == 'radar-final-frozen' || steps.radar.outputs.state == 'radar-final-immutable'
        run: python tools/enrich_ai_shadow_benchmarks.py
      - name: 原子保存雷达与智能影子实盘账本
        if: steps.radar.outputs.state == 'radar-live-updated' || steps.radar.outputs.state == 'radar-final-frozen' || steps.radar.outputs.state == 'radar-final-immutable'
        run: |
          git config user.name 'astock-radar-ai-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add astock_radar astock_ai_portfolio
          if git diff --cached --quiet; then
            echo 'No radar or shadow portfolio changes.'
            exit 0
          fi
          git commit -m 'Update all-day radar and AI shadow portfolio'
          pushed=0
          for i in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            sleep 2
          done
          if [ "$pushed" -ne 1 ]; then
            echo 'Failed to persist radar + shadow portfolio after retries.'
            exit 1
          fi
