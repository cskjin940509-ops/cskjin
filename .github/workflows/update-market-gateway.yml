name: Update AStock Market Gateway

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tools/update_market_gateway.py'
      - 'tools/sanitize_market_gateway.py'
      - 'tools/ensure_market_snapshot_core_indices.py'
      - 'tools/enrich_yunai_gateway.py'
      - 'tools/yunai_tail_overlay.py'
      - 'tools/sync_yunai_production.py'
      - 'tools/update_trade_execution_signals.py'
      - 'tools/update_trade_execution_signals_strict.py'
      - 'tools/run_tail_rolling_reliable.py'
      - '.github/workflows/update-market-gateway.yml'
  schedule:
    # 北京交易时段：09:30-11:30 / 13:00-15:00，每5分钟刷新行情与交易辅助。
    # cron会覆盖稍宽时间段，严格包装器负责排除午休与盘外时段。
    - cron: '*/5 1-3 * * 1-5'
    - cron: '*/5 5-7 * * 1-5'
    # 收盘后立刻补抓。15:02/15:06/15:10优先形成可验证收盘快照；15:20/15:30继续兜底。
    - cron: '2,6,10,20,30 7 * * 1-5'
    # 晚间只做额外数据兜底，不再作为正式股票池生成前置条件。
    - cron: '30 9 * * 1-5'

permissions:
  contents: write
  actions: write

concurrency:
  group: astock-market-gateway
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: 记录市场网关运行编号
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONTENT=$(printf '%s' '${{ github.run_id }}' | base64 -w0)
          OLD_SHA=$(gh api repos/${{ github.repository }}/contents/latest-yunai-production-run.txt?ref=main --jq .sha 2>/dev/null || true)
          if [ -n "$OLD_SHA" ]; then
            gh api --method PUT repos/${{ github.repository }}/contents/latest-yunai-production-run.txt -f message='Record latest Yunai production run' -f content="$CONTENT" -f sha="$OLD_SHA" -f branch='main' >/dev/null
          else
            gh api --method PUT repos/${{ github.repository }}/contents/latest-yunai-production-run.txt -f message='Record latest Yunai production run' -f content="$CONTENT" -f branch='main' >/dev/null
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 抓取并校验A股市场数据
        run: |
          python tools/update_market_gateway.py
          python tools/sanitize_market_gateway.py
          python tools/ensure_market_snapshot_core_indices.py
      - name: 校验后立即发布市场数据并通知下游
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_data_on_arrival.py gateway

      - name: 接入 Yunai Quant API
        env:
          YUNAI_TOKEN: ${{ secrets.YUNAI_TOKEN }}
        run: |
          python tools/enrich_yunai_gateway.py
          python tools/sync_yunai_production.py

      - name: 独立确认到达后立即发布并通知下游
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/publish_data_on_arrival.py gateway
