name: Update AStock Market Gateway

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tools/update_market_gateway.py'
      - 'tools/sanitize_market_gateway.py'
      - '.github/workflows/update-market-gateway.yml'
  schedule:
    # 北京交易时段兜底快照：09:30-11:30 / 13:00-15:00，每10分钟
    - cron: '*/10 1-3 * * 1-5'
    - cron: '*/10 5-7 * * 1-5'
    # 收盘后再补抓，确保收盘事实层可用
    - cron: '10,30 7 * * 1-5'
    - cron: '30 9 * * 1-5'

permissions:
  contents: write

concurrency:
  group: astock-market-gateway
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 抓取并校验A股市场数据
        run: |
          python tools/update_market_gateway.py
          python tools/sanitize_market_gateway.py
      - name: 保存数据网关与历史市场快照
        run: |
          if git diff --quiet -- astock_gateway astock_snapshots/index.json; then
            echo 'No market data changes.'
            exit 0
          fi
          git config user.name 'astock-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add astock_gateway astock_snapshots/index.json
          git commit -m 'Update A-share market gateway snapshot'
          git pull --rebase origin main
          git push origin HEAD:main
