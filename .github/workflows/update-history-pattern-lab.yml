name: Update AStock 动态历史形态实验室

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tools/update_history_pattern_lab.py'
      - '.github/workflows/update-history-pattern-lab.yml'
  schedule:
    # 北京时间工作日16:45，在正式收益跟踪完成后重算历史形态。
    - cron: '45 8 * * 1-5'

permissions:
  contents: write

concurrency:
  group: astock-history-pattern-lab
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: 记录历史研究运行编号
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONTENT=$(printf '%s' '${{ github.run_id }}' | base64 -w0)
          OLD_SHA=$(gh api repos/${{ github.repository }}/contents/latest-history-run.txt?ref=main --jq .sha 2>/dev/null || true)
          if [ -n "$OLD_SHA" ]; then
            gh api --method PUT repos/${{ github.repository }}/contents/latest-history-run.txt -f message='Record latest history pattern run' -f content="$CONTENT" -f sha="$OLD_SHA" -f branch='main' >/dev/null
          else
            gh api --method PUT repos/${{ github.repository }}/contents/latest-history-run.txt -f message='Record latest history pattern run' -f content="$CONTENT" -f branch='main' >/dev/null
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 重算动态历史形态
        run: python tools/update_history_pattern_lab.py
      - name: 保存动态历史研究结果
        run: |
          if [ -z "$(git status --porcelain -- astock_history)" ]; then
            echo 'No history changes.'
            exit 0
          fi
          git config user.name 'astock-history-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- astock_history
          git commit -m 'Update dynamic A-share history pattern lab'
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Retry history push $i"
            sleep $((i*2))
          done
          exit 1
